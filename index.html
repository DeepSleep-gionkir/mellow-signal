function lead(s){const order=s.map((v,i)=>({i,v,strength:Math.abs(v-50)})).sort((a,b)=>b.strength-a.strength);if(order[0].strength===0)return '어느 한쪽만 고집하기보다 상황에 따라 여러 매력을 알아보는 취향이에요. 유형 이름보다 아래의 반반인 성향들을 함께 읽어 보세요.';const a=order[0],b=order[1];return `${a.v>50?AXES[a.i].high:AXES[a.i].low}에게 특히 마음이 가요.${b.strength>0?` ${b.v>50?AXES[b.i].high:AXES[b.i].low}의 모습도 눈여겨보는 편이에요.`:''}`;}
function result(){const s=scores(),type=TYPES[typeFor(s)];return `<div class="page-heading"><span class="eyebrow">YOUR SIGNAL REPORT</span><h1>작은 선택들이 그린, 나의 이상형.</h1><p>사람을 정해 놓기보다, 내가 끌리는 순간을 알아보세요.</p></div><div class="result-tabs" role="tablist" aria-label="결과 메뉴"><button role="tab" aria-selected="${state.tab==='report'}" class="${state.tab==='report'?'active':''}" data-action="tab" data-tab="report">취향 리포트</button><button role="tab" aria-selected="${state.tab==='answers'}" class="${state.tab==='answers'?'active':''}" data-action="tab" data-tab="answers">나의 20가지 선택</button><button role="tab" aria-selected="${state.tab==='match'}" class="${state.tab==='match'?'active':''}" data-action="tab" data-tab="match">궁합 맞춰 보기</button></div><section role="tabpanel">${state.tab==='report'?report(s,type):state.tab==='answers'?records():compare(true)}</section>`;}
function report(s,type){const recommendations=TYPES.filter(t=>t.id!==type.id).map(t=>({t,score:compatibility(s,idealScores(t.id)).score})).sort((a,b)=>b.score-a.score||a.t.id-b.t.id).slice(0,3);return `<div class="result-grid"><section class="result-hero"><span class="eyebrow">내가 마음이 가는 사람 · ${type.code}</span>${emblem(type.id)}<h2>${type.name}</h2><div class="chips">${s.map((v,i)=>`<span class="chip">${v===50?'두 매력의 균형':v>50?AXES[i].right:AXES[i].left}</span>`).join('')}</div><p>${lead(s)}</p></section><section class="panel"><h2>나의 취향 스펙트럼</h2><p>좋고 나쁨이 아닌, 마음이 기우는 방향이에요.</p>${bars(s)}</section></div><section class="report-section"><h2>조금 더 들여다보면</h2><div class="detail-grid">${s.map((v,i)=>`<article class="trait-detail"><span class="eyebrow">0${i+1} · ${AXES[i].name}</span><h3>${v===50?'두 방식 모두 매력적이에요':(v>50?AXES[i].right:AXES[i].left)+'에 끌려요'}</h3><p>${v===50?`${AXES[i].left}과 ${AXES[i].right}, 어느 한쪽에 고정되지 않은 응답이에요. 상황에 따라 선호가 달라질 수 있어요.`:`${v>50?AXES[i].high:AXES[i].low}와 있을 때 편안함이나 매력을 느낄 수 있어요.`}</p></article>`).join('')}</div></section><section class="report-section"><h2>이런 유형도 잘 맞을 수 있어요</h2><p class="subtle" style="font-size:14px">내가 원하는 모습과 가까운 다른 이상형 유형이에요. 실제 사람의 성격을 판정한 것은 아니에요.</p><div class="recommendations">${recommendations.map(({t,score})=>`<button class="type-mini" data-action="type-detail" data-id="${t.id}"><span class="rank">취향 근접도 ${score}</span>${emblem(t.id,true)}<h3>${t.name}</h3><p>${tagList(t.id).slice(0,2).join(' · ')} <span aria-hidden="true">↗</span></p></button>`).join('')}</div></section><section class="panel report-section"><h2>우리의 취향은 얼마나 닮았을까?</h2><p>내 코드를 복사해 두고 다른 사람의 결과 코드와 비교해 보세요. 코드에는 다섯 성향 수치만 들어 있어요.</p><div class="code-box"><code>${makeCode(s)}</code><button class="secondary" data-action="copy">코드 복사</button><button class="primary" data-action="tab" data-tab="match">궁합 맞춰 보기 ↗</button></div></section><details class="method"><summary>이 수치와 유형은 어떻게 정해지나요?</summary><p>160문항을 5개 성향으로 나누고, 각 성향에서 중복 없이 4개씩 뽑아요. 각 선택은 해당 성향의 왼쪽에 −2, 오른쪽에 +2, 두 방식을 함께 담은 선택에는 0점을 더해요. 4문항의 평균을 0–100으로 바꾼 값이 오른쪽 성향 수치이며, 반대쪽은 100에서 이 값을 뺀 값이에요.<br><br>각 성향이 50보다 높은지에 따라 2⁵ = 32가지 유형으로 묶어요. 정확히 50이면 분류 편의상 왼쪽 그룹에 넣지만, 해석은 ‘반반’으로 표시해요. 50에 가까울수록 다른 문항에서 유형이 바뀌기 쉬워요. 유형별 대표값은 왼쪽 25, 오른쪽 75이며 추천은 그 값과의 평균 차이가 작은 순서예요.<br><br>궁합 지수는 100 − 다섯 성향 수치 차이의 평균이에요. 두 사람의 <b>이상형 취향 유사도</b>이며, 성격 궁합이나 연애 성공 확률이 아니에요. 임상·심리 검사를 바탕으로 표준화된 테스트가 아닌, 재미를 위한 자체 분류예요.</p></details><div class="button-row report-section"><button class="secondary" data-action="restart">새로운 20문항으로 다시 하기</button><button class="text-button" data-action="edit-answers">답변 수정하기 →</button></div>`;}
function records(){return `<p class="subtle" style="font-size:14px">선택한 답과 각 성향에 반영된 방향을 모두 모았어요.</p>${state.questions.map((q,i)=>{const o=q.options[state.answers[q.id]];return `<article class="record"><div class="record-top"><span>QUESTION ${String(i+1).padStart(2,'0')} · ${AXES[q.axis].name}</span><button class="text-button" style="font-size:12px;padding:0" data-action="edit-one" data-index="${i}">답변 수정 ↗</button></div><h3>${ESC(q.prompt)}</h3><div class="record-choice">✓ &nbsp;${ESC(o.text)}</div><p class="record-meta">반영된 방향 · ${o.value===0?'두 방식의 균형 (0점)':o.value<0?`${AXES[q.axis].left} (−2점)`:`${AXES[q.axis].right} (+2점)`}</p><details><summary>다른 선택지 보기</summary><ul>${q.options.filter((_,j)=>j!==state.answers[q.id]).map(x=>`<li>${ESC(x.text)}</li>`).join('')}</ul></details></article>`;}).join('')}`;}
function typeOptions(selected){return TYPES.map(t=>`<option value="${t.id}" ${String(t.id)===String(selected)?'selected':''}>${t.code} · ${t.name}</option>`).join('');}
function compare(embedded=false){const own=state.completed?scores():null;return `${embedded?'':`<div class="page-heading"><span class="eyebrow">A LITTLE CHEMISTRY</span><h1>서로의 시그널, 맞춰 볼까?</h1><p>결과 코드 두 개로 더 자세하게, 유형 이름으로 가볍게.</p></div>`}<div class="compare-layout"><section class="panel"><h2>궁합 맞춰 보기</h2><p>두 사람이 바라는 관계의 모습이 얼마나 비슷한지 알아봐요.</p><div class="segmented" aria-label="비교 방식"><button class="${compareMode==='code'?'active':''}" data-action="compare-mode" data-mode="code" aria-pressed="${compareMode==='code'}">결과 코드로 비교</button><button class="${compareMode==='type'?'active':''}" data-action="compare-mode" data-mode="type" aria-pressed="${compareMode==='type'}">유형으로 비교</button></div><form id="compare-form" novalidate>${compareMode==='code'?`<div class="field"><label for="mine-code">나의 결과 코드</label><input id="mine-code" name="mine" maxlength="30" autocomplete="off" spellcheck="false" placeholder="ML1-로 시작하는 코드" value="${ESC(compareInputs.mine||(own?makeCode(own):''))}" required><small>${own?'완료한 내 결과를 넣어 두었어요. 다른 코드로 바꿔도 좋아요.':'테스트 결과에서 복사한 코드를 넣어 주세요.'}</small></div><div class="field"><label for="other-code">상대의 결과 코드</label><input id="other-code" name="other" maxlength="30" autocomplete="off" spellcheck="false" placeholder="상대의 코드를 붙여 넣어 주세요" value="${ESC(compareInputs.other)}" required></div>`:`<div class="field"><label for="own-type">나의 유형</label><select id="own-type" name="ownType">${typeOptions(compareInputs.ownType)}</select></div><div class="field"><label for="other-type">상대의 유형</label><select id="other-type" name="type">${typeOptions(compareInputs.type)}</select><small>유형의 대표 수치를 비교해요. 같은 유형도 실제 응답 수치는 다를 수 있어요.</small></div>`}<button class="primary" type="submit" style="width:100%">우리의 취향 비교하기 <span aria-hidden="true">↔</span></button><p id="compare-error" class="error" role="alert"></p></form><p style="margin-top:22px;font-size:12px">궁합 지수는 이상형 취향의 유사도예요.<br>실제 성격이나 연애 성공 확률을 뜻하지 않아요.</p>${!own?'<button class="text-button" data-action="test">아직 코드가 없나요? 테스트하러 가기 →</button>':''}</section><div id="comparison-output" aria-live="polite">${compareOutput?matchOutput(compareOutput):`<section class="compare-placeholder"><div class="compare-symbol" aria-hidden="true">+ × +</div><h2>비슷한 점도,<br>다른 점도 발견해요.</h2><p>두 결과를 넣으면<br>다섯 성향을 나란히 비교해 드릴게요.</p></section>`}</div></div>`;}
function matchOutput(out){const {a,b,result,mode}=out;const sorted=result.differences.map((d,i)=>({d,i})).sort((x,y)=>x.d-y.d);const near=sorted[0],far=sorted[4];const aType=TYPES[typeFor(a)],bType=TYPES[typeFor(b)];return `<section class="match-result"><span class="eyebrow">${mode==='type'?'유형 대표값 기준':'실제 응답 수치 기준'} · 취향 궁합</span><div class="score">${result.score}<span>/ 100</span></div><h2>${result.score>=85?'마음이 향하는 방향이 닮았어요':result.score>=65?'닮은 리듬, 서로 다른 포인트':result.score>=40?'다른 매력을 발견하는 조합':'취향의 방향이 꽤 달라요'}</h2><p>${aType.name} × ${bType.name}</p>${AXES.map((axis,i)=>`<div class="compare-axis"><div><strong>${axis.name}</strong><span>${result.differences[i]}점 차이</span></div><div class="compare-track"><span style="width:${100-result.differences[i]}%"></span></div><div style="margin-top:6px;color:#7b6c93;font-size:11px"><span>나 ${a[i]} · 상대 ${b[i]}</span><span>${axis.right} 기준</span></div></div>`).join('')}<h3 style="margin-top:28px">${near.d===far.d?'다섯 성향을 함께 읽어 봐요':'가장 비슷한 지점'}</h3><p>${near.d===far.d?'모든 성향에서 차이가 같아요. 한 가지 점수보다 각 방향을 어떻게 좋아하는지 대화를 나눠 보세요.':`${AXES[near.i].name}에서 ${near.d}점 차이로 가장 가까워요. 서로 좋아하는 상황을 구체적으로 이야기하면 공통점을 찾기 쉬워요.`}</p>${far.d>0?`<h3>함께 이야기해 보면 좋은 것</h3><p>${AXES[far.i].tip}</p>`:'<p>수치가 같아도 실제 성격과 생활 방식까지 같다는 뜻은 아니에요. 서로 어떤 장면을 골랐는지 이야기해 보세요.</p>'}<p style="font-size:12px;border-top:1px solid #d9cfee;padding-top:16px;margin-bottom:0">높은 점수는 취향이 비슷하다는 뜻이에요. 낮아도 나쁜 관계라는 뜻은 아니며, 서로 맞춰 가는 방식이 더 중요해요.</p></section>`;}
function catalog(){return `<div class="page-heading"><span class="eyebrow">32 WAYS TO CATCH YOUR EYE</span><h1>다 다르게, 마음이 가는 사람들.</h1><p>나의 성격이 아니라, 내가 끌리는 사람의 모습을 모았어요.</p></div><div class="catalog">${TYPES.map(t=>`<button class="type-mini" data-action="type-detail" data-id="${t.id}">${emblem(t.id,true)}<h3>${t.name}</h3><p>${t.code}</p><div class="chips">${chips(t.id)}</div></button>`).join('')}</div>`;}
function showType(id){if(!TYPES[id])return;const t=TYPES[id];const dialog=$('#type-dialog');dialog.innerHTML=`<button class="dialog-close" data-action="close-type" aria-label="닫기">×</button><span class="eyebrow">TYPE ARCHIVE · ${t.code}</span>${emblem(id)}<h2 id="dialog-title">${t.name}</h2><div class="chips">${chips(id)}</div><p style="margin-top:24px">이런 모습을 가진 사람에게 마음이 가는 취향이에요.</p>${t.bits.map((b,i)=>`<div class="dialog-trait"><b>${AXES[i].name}</b>${b?AXES[i].high:AXES[i].low}</div>`).join('')}<p style="margin-top:22px">유형은 여러 매력을 묶은 이름이에요. 실제 사람을 한 가지 유형으로 단정하지 않아요.</p><button class="primary" data-action="compare-with" data-id="${id}" style="width:100%">이 유형과 비교하기 ↔</button>`;dialog.showModal();}
function captureInputs(){const form=$('#compare-form');if(form){for(const [k,v] of new FormData(form))compareInputs[k]=v;}}
function render(){document.querySelectorAll('.nav-link').forEach(el=>el.classList.toggle('active',el.dataset.action===(state.view==='types'?'types':state.view==='compare'?'compare':'test')));root.innerHTML=state.view==='home'?home():state.view==='quiz'?quiz():state.view==='result'?result():state.view==='types'?catalog():compare();}
function answer(i){const q=state.questions[state.index];if(state.view!=='quiz'||!Number.isInteger(i)||!q.options[i])throw Error('선택 가능한 문항과 답을 확인해 주세요.');state.answers[q.id]=i;if(state.completed){compareOutput=null;compareInputs.mine=makeCode(scores());compareInputs.ownType=String(typeFor(scores()));}save();render();root.querySelector(`[data-action="answer"][data-index="${i}"]`)?.focus({preventScroll:true});return {question:state.index+1,answered:Object.keys(state.answers).length};}
function next(){const q=state.questions[state.index];if(state.answers[q.id]===undefined)return;if(state.index<19){state.index++;save();render();focusHeading();}else{const missing=state.questions.findIndex(q=>state.answers[q.id]===undefined);if(missing>=0){state.index=missing;save();render();focusHeading();toast('아직 선택하지 않은 장면으로 이동했어요.');}else{state.completed=true;state.tab='report';compareInputs.mine=makeCode(scores());compareInputs.ownType=String(typeFor(scores()));save();go('result');}}}
document.addEventListener('click',async e=>{const brand=e.target.closest('.brand');if(brand){e.preventDefault();go('home');return;}const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action,i=Number(btn.dataset.index);captureInputs();if(a==='home')go('home');else if(a==='test'||a==='start'){if(state.completed)go('result');else if(state.questions.length)go('quiz');else if(a==='start')start();else go('home');}else if(a==='types')go('types');else if(a==='compare'){compareInputs.ownType=state.completed?String(typeFor(scores())):compareInputs.ownType;go('compare');}else if(a==='answer')answer(i);else if(a==='next')next();else if(a==='previous'){state.index=Math.max(0,state.index-1);save();render();focusHeading();}else if(a==='jump'){state.index=i;save();render();focusHeading();}else if(a==='tab'){state.tab=btn.dataset.tab;render();}else if(a==='restart')$('#restart-dialog').showModal();else if(a==='cancel-restart')$('#restart-dialog').close();else if(a==='confirm-restart'){$('#restart-dialog').close();start();}else if(a==='type-detail')showType(Number(btn.dataset.id));else if(a==='close-type')$('#type-dialog').close();else if(a==='compare-with'){compareMode='type';compareOutput=null;compareInputs.type=btn.dataset.id;compareInputs.ownType=state.completed?String(typeFor(scores())):compareInputs.ownType;$('#type-dialog').close();go('compare');}else if(a==='compare-mode'){compareMode=btn.dataset.mode;compareOutput=null;render();}else if(a==='edit-one'||a==='edit-answers'){state.index=a==='edit-one'?i:0;go('quiz');}else if(a==='copy'){try{await navigator.clipboard.writeText(makeCode(scores()));toast('결과 코드를 복사했어요.');}catch{const code=root.querySelector('.code-box code');if(code){const range=document.createRange();range.selectNodeContents(code);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);}toast('코드를 선택했어요. 길게 누르거나 Ctrl/Cmd+C로 복사해 주세요.');}}});
document.addEventListener('submit',e=>{if(e.target.id!=='compare-form')return;e.preventDefault();captureInputs();try{let a,b;if(compareMode==='code'){try{a=parseCode(compareInputs.mine);}catch(err){$('#mine-code').focus();throw Error('나의 코드: '+err.message);}try{b=parseCode(compareInputs.other);}catch(err){$('#other-code').focus();throw Error('상대 코드: '+err.message);}}else{const mine=Number(compareInputs.ownType),other=Number(compareInputs.type);if(!TYPES[mine]||!TYPES[other])throw Error('두 유형을 선택해 주세요.');a=idealScores(mine);b=idealScores(other);}compareOutput={a,b,result:compatibility(a,b),mode:compareMode};$('#compare-error').textContent='';$('#comparison-output').innerHTML=matchOutput(compareOutput);if(innerWidth<700)$('#comparison-output').scrollIntoView({behavior:'smooth',block:'start'});}catch(err){$('#compare-error').textContent=err.message;compareOutput=null;$('#comparison-output').innerHTML='<section class="compare-placeholder"><h2>코드를 한 번 더 확인해 주세요.</h2><p>올바른 두 결과를 입력하면 비교할 수 있어요.</p></section>';}});
render();
if(document.modelContext?.registerTool){const controller=new AbortController();const registered=[{name:'get_test_state',description:'현재 이상형 테스트 문항과 응답 진행 상태를 읽습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return {view:state.view,completed:state.completed,answered:Object.keys(state.answers).length,current:state.view==='quiz'?{number:state.index+1,prompt:state.questions[state.index].prompt,options:state.questions[state.index].options.map((o,i)=>({index:i,text:o.text}))}:null,result:state.completed?{type:TYPES[typeFor(scores())].name,scores:scores(),code:makeCode(scores())}:null};}},{name:'answer_current_question',description:'현재 화면의 문항에 사용자가 고른 0부터 시작하는 선택지를 반영합니다. 다음 문항으로 자동 이동하지 않습니다.',inputSchema:{type:'object',properties:{optionIndex:{type:'integer',minimum:0,maximum:2}},required:['optionIndex'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||Object.keys(input).some(k=>k!=='optionIndex'))throw Error('올바른 선택지 인덱스가 필요합니다.');return answer(input.optionIndex);}}];for(const t of registered){try{Promise.resolve(document.modelContext.registerTool(t,{signal:controller.signal})).catch(()=>{});}catch{}}window.addEventListener('pagehide',()=>controller.abort(),{once:true});}

</script>
</body></html>
